name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          channel: 'stable'
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: '10.0'
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: apps/dispatcher

      - name: Build APK (release)
        run: flutter build apk --release
        working-directory: apps/dispatcher

      - name: Verify APK
        run: |
          ls -la build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
        working-directory: apps/dispatcher

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Dispatcher App ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            apps/dispatcher/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: apps/dispatcher

      - name: Build Linux (release)
        run: flutter build linux --release
        working-directory: apps/dispatcher

      - name: Package Linux binary
        run: |
          cd apps/dispatcher/build/linux/x64/release/bundle
          tar -czf ../../../../dispatcher-linux-${{ github.ref_name }}.tar.gz dispatcher
          ls -la ../../../../dispatcher-linux-${{ github.ref_name }}.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-linux-${{ github.ref_name }}
          path: apps/dispatcher/dispatcher-linux-${{ github.ref_name }}.tar.gz
          retention-days: 30

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/dispatcher/dispatcher-linux-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}