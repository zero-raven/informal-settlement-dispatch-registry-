name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Services (Node + Python) and demo loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/registry-api/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/graph-service/requirements.txt

      - name: Install
        run: |
          npm ci --prefix services/registry-api
          python -m venv .venv
          .venv/bin/pip install -r services/graph-service/requirements.txt

      - name: Node tests (sync-core, registry-api, consent-api)
        run: node --test packages/sync-core/test/*.test.js services/registry-api/test/*.test.js services/consent-api/test/*.test.js

      - name: Python tests (graph-service)
        run: .venv/bin/python -m pytest services/graph-service/test -q

      - name: Demo loop selftest
        run: bash scripts/demo.sh selftest

  app:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dispatcher
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
